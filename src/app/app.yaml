command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

# PGHOST / PGPORT / PGDATABASE / PGUSER / PGSSLMODE / LAKEBASE_ENDPOINT are
