bundle:
  name: car-trip-map

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: 'car-trip-map'
      description: 'Map and daily stats of logged car trips'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, dashboards.genie, files.files, serving.serving-endpoints
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    workspace:
      host: https://dbc-1bff540e-abbc.cloud.databricks.com

    variables:
      sql_warehouse_id: 153ca2fe17b9c405
