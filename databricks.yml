# This is a Databricks asset bundle definition for car_trip_tracker.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: car_trip_tracker
  uuid: 9d47e0b7-df6e-4d0b-8bdd-13e768c788e5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema the pipeline writes its tables to
  source_table:
    description: The Lakehouse Sync CDC history table the pipeline reads

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1bff540e-abbc.cloud.databricks.com
    variables:
      catalog: car_usage
      schema: dev
      source_table: car_usage.lakebase_cdc.lb_logs_history
  prod:
    mode: production
    workspace:
      host: https://dbc-1bff540e-abbc.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/toth.bence.mihaly@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/toth.bence.mihaly@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: car_usage
      schema: prod
      source_table: car_usage.lakebase_cdc.lb_logs_history
    permissions:
      - user_name: toth.bence.mihaly@gmail.com
        level: CAN_MANAGE
